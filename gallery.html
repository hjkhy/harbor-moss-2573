function scan(root){

 if(root&&root.nodeType===1)els.push(root);
 if(root&&root.querySelectorAll){
  var a=root.querySelectorAll('img[src],video[src],audio[src],source[src]');
  for(var i=0;i<a.length;i++)els.push(a[i]);
  var b=root.querySelectorAll('[style*="assets/"]');
  for(var j=0;j<b.length;j++)els.push(b[j]);
 }
 for(var k=0;k<els.length;k++){
  var el=els[k],tn=el.tagName;
  if(tn==='IMG'||tn==='VIDEO'||tn==='AUDIO'||tn==='SOURCE'){
   var u=el.getAttribute('src');
   if(u&&u.indexOf('data:')!==0&&u.indexOf('blob:')!==0&&u.indexOf('http')!==0) tag(el);
  } else if(el.getAttribute&&(el.getAttribute('style')||'').indexOf('assets/')>=0){ tag(el); }
 }
}
function boot(pw){
 CPW=pw;
 setTimeout(function(){scan(document);sweep()},150);
 setTimeout(function(){scan(document);sweep()},2500);
 setTimeout(function(){scan(document);sweep()},8000);
 var sweeper=null;
 window.addEventListener('scroll',function(){ if(sweeper)return; sweeper=setTimeout(function(){sweeper=null; sweep();},250); },true);
 if('MutationObserver' in window){ try{
  var mo=new MutationObserver(function(muts){
   for(var i=0;i<muts.length;i++){ var m=muts[i];
    if(m.type==='childList'){ for(var j=0;j<m.addedNodes.length;j++){ var n=m.addedNodes[j]; if(n.nodeType===1) scan(n); } }
    else if(m.type==='attributes'&&m.target&&m.target.nodeType===1&&!m.target.__dtag){ scan(m.target); }
   }
  });
  mo.observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['src','style']});
 }catch(e){} }
}
function attempt(pw,silent){
 return pageKey(pw).then(function(k){
  return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(C.i)},k,b64(C.d));
 }).then(function(pt){
  try{sessionStorage.setItem('__ss_pw',pw)}catch(e){}
  document.open();document.write(dec.decode(pt));document.close();
  boot(pw);
  return true;
 }).catch(function(){return false});
}
function hookSrc(Proto){
 try{
  var d=Object.getOwnPropertyDescriptor(Proto,'src');
  if(!d||!d.set||d.set.__hooked)return;
  var ns=function(v){
   try{
    if(typeof v==='string'&&v&&v.indexOf('data:')!==0&&v.indexOf('blob:')!==0&&v.indexOf('http')!==0&&v.indexOf('javascript:')!==0){
     if(!this.__orig){ this.__orig=v; try{this.onerror=null}catch(e){}
      if(this.tagName==='IMG'){ d.set.call(this,PH); } else { try{this.removeAttribute('src')}catch(e){} } }
     tag(this);
     return;
    }
   }catch(e){}
   d.set.call(this,v);
  };
  ns.__hooked=1;
  Object.defineProperty(Proto,'src',{configurable:true,enumerable:true,get:function(){return d.get.call(this)},set:ns});
 }catch(e){}
}
function installHooks(){
 try{ hookSrc(HTMLImageElement.prototype); hookSrc(HTMLMediaElement.prototype); if(window.HTMLSourceElement)hookSrc(HTMLSourceElement.prototype); }catch(e){}
 try{
  var sa=Element.prototype.setAttribute;
  if(sa&&!sa.__hooked){
   var nsa=function(n,v){ if((n+'').toLowerCase()==='src'&&this&&this.tagName==='IMG'&&typeof v==='string'&&v&&v.indexOf('data:')!==0&&v.indexOf('blob:')!==0&&v.indexOf('http')!==0){ this.src=v; return; } return sa.call(this,n,v); };
   nsa.__hooked=1; Element.prototype.setAttribute=nsa;
  }
 }catch(e){}
}
installHooks();
var cached=null;try{cached=sessionStorage.getItem('__ss_pw')}catch(e){}
if(cached){attempt(cached,true)}
