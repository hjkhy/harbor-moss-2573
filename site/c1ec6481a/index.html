<script>
(function(){

var C=JSON.parse(document.getElementById('c').textContent);

function pump(){
 while(inFlight<MAXC&&q.length){
  var el=q.shift(); inFlight++;

     return crypto.subtle.decrypt({name:'AES-GCM',iv:iv},k,ct).then(function(pt){

      else { try{el.loading='eager'}catch(e){} el.src=bu; }

   el.__orig=u;
   if(el.tagName==='IMG'){ try{el.src=PH}catch(e){} } else { try{el.removeAttribute('src')}catch(e){} }
  } else if(el.getAttribute){
   var s=el.getAttribute('style')||'';
   var m=s.match(/url\(["']?([^"')]+)["']?\)/);
   if(m&&m[1].indexOf('assets/')>=0){ el.__orig=m[1]; el.__bg=1; try{el.style.backgroundImage='url("'+PH+'")'}catch(e){} }
