<script>
(function(){
'use strict';
var C=JSON.parse(document.getElementById('c').textContent);
var ITER=C.n;
function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
var enc=new TextEncoder(),dec=new TextDecoder();
var assetKey=null,assetKeyPw=null;
function importKm(pw){return crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey'])}
function pageKey(pw){return importKm(pw).then(function(km){return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(C.s),iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt'])})}
function getAssetKey(pw){
 if(assetKey&&assetKeyPw===pw)return Promise.resolve(assetKey);
 return importKm(pw).then(function(km){return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(C.as),iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt'])}).then(function(k){assetKey=k;assetKeyPw=pw;return k});
}
var MIME={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',webp:'image/webp',gif:'image/gif',mp4:'video/mp4',mov:'video/quicktime',webm:'video/webm',ogg:'audio/ogg',mp3:'audio/mpeg',svg:'image/svg+xml'};
function decryptAssets(pw){
 var els=document.querySelectorAll('img[src],video[src],audio[src],source[src]');
 if(!els.length)return;
 var done=0,total=0;
 var list=[];
 for(var i=0;i<els.length;i++){
  var u=els[i].getAttribute('src');
  if(!u||u.indexOf('data:')===0||u.indexOf('blob:')===0||u.indexOf('http')===0)continue;
  list.push([els[i],u]);
 }
 total=list.length;if(!total)return;
 document.getElementById&&(document.getElementById('sp'))&&(document.getElementById('sp').textContent='');
 getAssetKey(pw).then(function(k){
  list.forEach(function(pair){
   var el=pair[0],u=pair[1];
   fetch(u).then(function(r){return r.arrayBuffer()}).then(function(buf){
    var b=new Uint8Array(buf),iv=b.slice(0,12),ct=b.slice(12);
    return crypto.subtle.decrypt({name:'AES-GCM',iv:iv},k,ct).then(function(pt){
     var ext=(u.split('.').pop()||'').toLowerCase();
     var blob=new Blob([pt],{type:MIME[ext]||'application/octet-stream'});
     el.src=URL.createObjectURL(blob);
     el.removeAttribute('data-locked');
    });
   }).catch(function(){});
  });
 });
}
function attempt(pw,silent){
 return pageKey(pw).then(function(k){
  return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(C.i)},k,b64(C.d));
 }).then(function(pt){
  try{sessionStorage.setItem('__ss_pw',pw)}catch(e){}
  document.open();document.write(dec.decode(pt));document.close();
  setTimeout(function(){decryptAssets(pw)},150);
  return true;
 }).catch(function(){if(!silent){document.getElementById('err').textContent='Wrong password.'}return false});
}
var cached=null;try{cached=sessionStorage.getItem('__ss_pw')}catch(e){}
if(cached){attempt(cached,true)}else{
 document.getElementById('go').addEventListener('click',function(){attempt(document.getElementById('pw').value,false)});
 document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')attempt(document.getElementById('pw').value,false)});
}
})();
</script></body></html>
