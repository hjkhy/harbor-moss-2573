<script>
(function(){
'use strict';
var C=JSON.parse(document.getElementById('c').textContent);
var ITER=C.n;
function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
var enc=new TextEncoder(),dec=new TextDecoder();
var assetKey=null,assetKeyPw=null;

 return importKm(pw).then(function(km){return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(C.as),iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt'])}).then(function(k){assetKey=k;assetKeyPw=pw;return k});
}

window.__hbDecrypt=function(u){

  return fetch(u).then(function(r){ if(!r.ok)throw new Error('fetch'); return r.arrayBuffer(); }).then(function(buf){
   var b=new Uint8Array(buf),iv=b.slice(0,12),ct=b.slice(12);

  });
 });
};
var MIME={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',webp:'image/webp',gif:'image/gif',mp4:'video/mp4',mov:'video/quicktime',webm:'video/webm',ogg:'audio/ogg',mp3:'audio/mpeg',svg:'image/svg+xml'};

},{rootMargin:'1500px 0px'}):null;
function pump(){

   getAssetKey(CPW).then(function(k){
    return fetch(u).then(function(r){return r.arrayBuffer()}).then(function(buf){
