},{rootMargin:'1500px 0px'}):null;
function pump(){
 while(inFlight<MAXC&&q.length){
  var el=q.shift(); inFlight++;
  (function(el){
   var u=el.__orig,bg=el.__bg?1:0;
   if(!u){ inFlight--; return; }
   if(cache[u]){ var bu0=cache[u];
    if(bg){ el.style.backgroundImage='url("'+bu0+'")'; } else { try{el.loading='eager'}catch(e){} el.src=bu0; }
    el.__done=1; inFlight--; pump(); return; }
   getAssetKey(CPW).then(function(k){
    return fetch(u).then(function(r){return r.arrayBuffer()}).then(function(buf){
     var b=new Uint8Array(buf),iv=b.slice(0,12),ct=b.slice(12);
     return crypto.subtle.decrypt({name:'AES-GCM',iv:iv},k,ct).then(function(pt){
      var ext=(u.split('.').pop()||'').toLowerCase();
      var blob=new Blob([pt],{type:MIME[ext]||'application/octet-stream'});
      var bu=URL.createObjectURL(blob);
      if(bg){ el.style.backgroundImage='url("'+bu+'")'; }
      else { try{el.loading='eager'}catch(e){} el.src=bu; }
      el.removeAttribute('data-locked');
      cache[u]=bu;
      el.__done=1;
     });
    });
   }).then(function(){ inFlight--; pump(); },function(){ inFlight--; pump(); });
  })(el);
 }
}
var PH='data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
var pend=[];
function tag(el){
 if(el.__dtag)return; el.__dtag=1;
 try{el.onerror=null}catch(e){}
 if(!el.__orig){
  var u=el.getAttribute&&el.getAttribute('src');
  if(u){
   if(u.indexOf('data:')===0||u.indexOf('blob:')===0||u.indexOf('http')===0)return;
   el.__orig=u;
   if(el.tagName==='IMG'){ try{el.src=PH}catch(e){} } else { try{el.removeAttribute('src')}catch(e){} }
  } else if(el.getAttribute){
   var s=el.getAttribute('style')||'';
   var m=s.match(/url\(["']?([^"')]+)["']?\)/);
   if(m&&m[1].indexOf('assets/')>=0){ el.__orig=m[1]; el.__bg=1; try{el.style.backgroundImage='url("'+PH+'")'}catch(e){} }
  }
 }
 if(!el.__orig)return;
 pend.push(el);
 if(io){ io.observe(el); } else { q.push(el); pump(); }
}
function sweep(){
 var n=0;
 for(var i=0;i<pend.length&&n<50;i++){
  var el=pend[i];
  if(el.__done){ pend.splice(i,1); i--; continue; }
  if(el.__active)continue;
  var r=el.getBoundingClientRect();
  if(r.top<window.innerHeight+1500&&r.bottom>-1500){ el.__active=1; q.push(el); pump(); n++; }
 }
}
function scan(root){
 var els=[];
 if(root&&root.nodeType===1)els.push(root);
 if(root&&root.querySelectorAll){
  var a=root.querySelectorAll('img[src],video[src],audio[src],source[src]');
  for(var i=0;i<a.length;i++)els.push(a[i]);
  var b=root.querySelectorAll('[style*="assets/"]');
  for(var j=0;j<b.length;j++)els.push(b[j]);
 }
 for(var k=0;k<els.length;k++){
  var el=els[k],tn=el.tagName;
  if(tn==='IMG'||tn==='VIDEO'||tn==='AUDIO'||tn==='SOURCE'){
   var u=el.getAttribute('src');
   if(u&&u.indexOf('data:')!==0&&u.indexOf('blob:')!==0&&u.indexOf('http')!==0) tag(el);
  } else if(el.getAttribute&&(el.getAttribute('style')||'').indexOf('assets/')>=0){ tag(el); }
 }
}
function boot(pw){
 CPW=pw;
 setTimeout(function(){scan(document);sweep()},150);
 setTimeout(function(){scan(document);sweep()},2500);
 setTimeout(function(){scan(document);sweep()},8000);
 var sweeper=null;
 window.addEventListener('scroll',function(){ if(sweeper)return; sweeper=setTimeout(function(){sweeper=null; sweep();},250); },true);
 if('MutationObserver' in window){ try{
  var mo=new MutationObserver(function(muts){
   for(var i=0;i<muts.length;i++){ var m=muts[i];
    if(m.type==='childList'){ for(var j=0;j<m.addedNodes.length;j++){ var n=m.addedNodes[j]; if(n.nodeType===1) scan(n); } }
    else if(m.type==='attributes'&&m.target&&m.target.nodeType===1&&!m.target.__dtag){ scan(m.target); }
   }
  });

 }catch(e){} }
}
function attempt(pw,silent){
 return pageKey(pw).then(function(k){
  return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(C.i)},k,b64(C.d));
 }).then(function(pt){
  try{sessionStorage.setItem('__ss_pw',pw)}catch(e){}
  document.open();document.write(dec.decode(pt));document.close();
  boot(pw);
  return true;
 }).catch(function(){if(!silent){document.getElementById('err').textContent='Wrong password.'}return false});
}
function hookSrc(Proto){
 try{
  var d=Object.getOwnPropertyDescriptor(Proto,'src');
  if(!d||!d.set||d.set.__hooked)return;

   try{

     if(!this.__orig){ this.__orig=v; try{this.onerror=null}catch(e){}
      if(this.tagName==='IMG'){ d.set.call(this,PH); } else { try{this.removeAttribute('src')}catch(e){} } }
     tag(this);
     return;
    }
   }catch(e){}
   d.set.call(this,v);
  };

  Object.defineProperty(Proto,'src',{configurable:true,enumerable:true,get:function(){return d.get.call(this)},set:ns});

function installHooks(){

  var sa=Element.prototype.setAttribute;
  if(sa&&!sa.__hooked){
   var nsa=function(n,v){ if((n+'').toLowerCase()==='src'&&this&&this.tagName==='IMG'&&typeof v==='string'&&v&&v.indexOf('data:')!==0&&v.indexOf('blob:')!==0&&v.indexOf('http')!==0){ this.src=v; return; } return sa.call(this,n,v); };
   nsa.__hooked=1; Element.prototype.setAttribute=nsa;
  }

}
installHooks();
var cached=null;try{cached=sessionStorage.getItem('__ss_pw')}catch(e){}
if(cached){attempt(cached,true)}else{

}
